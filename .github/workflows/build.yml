name: Build HongGuoPurify

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build rootless package
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless -j"$(sysctl -n hw.ncpu)"

      - name: Verify preference bundle and package contents
        run: |
          set -e
          dpkg-deb -c packages/*.deb | grep 'var/jb/Library/MobileSubstrate/DynamicLibraries/HongGuoPurify.dylib'
          dpkg-deb -c packages/*.deb | grep 'var/jb/Library/PreferenceLoader/Preferences/HongGuoPurifyPrefs.plist'
          mkdir -p extracted
          dpkg-deb -x packages/*.deb extracted
          PREFS_BUNDLE="extracted/var/jb/Library/PreferenceBundles/HongGuoPurifyPrefs.bundle"
          test -f "$PREFS_BUNDLE/Info.plist"
          test -f "$PREFS_BUNDLE/HongGuoPurifyPrefs"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PREFS_BUNDLE/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSPrincipalClass' "$PREFS_BUNDLE/Info.plist"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: HongGuoPurify-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
