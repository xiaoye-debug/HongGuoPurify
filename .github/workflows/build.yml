name: Build HongGuoPurify

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Expand reconstructed source
        run: |
          set -euo pipefail
          base64 -d Tweak.xm.gz.b64 | gzip -dc > Tweak.xm
          test -s Tweak.xm
          grep -q 'HGInstallFeatureHooks' Tweak.xm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tweak.xm
          if ! git diff --cached --quiet; then
            git commit -m "Expand reconstructed HongGuoPurify source"
            git push
          fi

      - name: Install build dependencies
        run: |
          brew install ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build rootless package
        run: |
          export THEOS="$HOME/theos"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless -j"$(sysctl -n hw.ncpu)"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: HongGuoPurify-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
